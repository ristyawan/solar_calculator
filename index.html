#cr .two{display:flex;flex-direction:column;gap:14px}#cr .sticky{position:static;order:-1}#cr td input{min-width:60px}

#ht{color:#86efac}
@media(min-width:900px) and (orientation:landscape){main.wide{max-width:none}#ws{display:grid;grid-template-columns:3fr 2fr;gap:14px;align-items:start}#wt{display:none}#ws #cr,#ws #cl{display:block!important}#cr{position:sticky;top:64px;max-height:calc(100vh - 78px);overflow:auto}}

function dc(k){const o=cats()[k];S.cats=S.cats.filter(c=>c!==o);save();man()}
function ac(){const v=$('#nc2').value.trim();if(v){S.cats.push(v);save();man()}}
function mx(){const ca=cats();return`<datalist id="cl2">${ca.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><div class="card"><b>Kategori</b><div class="f" style="margin:8px 0">${ca.map((c,k)=>{const n=S.products.filter(p=>p.cat===c).length;return`<div><label>${n} produk${n?'':` <a href="#" onclick="dc(${k});return false">hapus</a>`}</label><input value="${esc(c)}" onchange="rc(${k},this.value)"></div>`}).join('')}</div><input id="nc2" placeholder="Kategori baru" style="width:60%"> <button class="s" onclick="ac()">Tambah</button></div><div class="card"><b>Backup &amp; Impor</b><p class="mut">Data hanya ada di browser ini. Ekspor, lalu simpan teksnya di tempat aman (catatan, chat ke diri sendiri).</p><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><button class="s" onclick="bk('all')">Ekspor semua</button><button class="s" onclick="bk('prod')">Ekspor produk</button><button class="b" onclick="ib('all')">Pulihkan semua</button><button class="b" onclick="ib('prod')">Impor produk</button><button class="s" onclick="rs()">Muat ulang katalog awal</button></div><textarea id="bk" rows="5"></textarea></div>`}
function bk(t){const a=$('#bk');a.value=JSON.stringify(t==='all'?S:S.products);a.select();try{navigator.clipboard.writeText(a.value);toast('Disalin ke clipboard')}catch(e){}}
function ib(t){try{const d=JSON.parse($('#bk').value);if(t==='all'){if(!d.products||!confirm('Timpa semua data dengan cadangan ini?'))return;S=d}else{if(!Array.isArray(d))throw 0;d.forEach(x=>{if(!x.sku||!x.name)return;const i=S.products.findIndex(p=>p.sku===x.sku);i<0?S.products.push({cost:null,custom:null,active:true,...x}):Object.assign(S.products[i],x)})}S.set={cur:'Rp',loc:'id-ID',mg:25,coaddr:'',cophone:'',foot:'',...S.set};S.qs=S.qs||[];S.ph=S.ph||[];S.cats=S.cats||[];save();toast('Berhasil');man()}catch(e){alert('Data tidak valid.')}}
function rs(){if(!confirm('Kembalikan produk dan harga bawaan dari Price List 2026? Produk tambahan Anda tetap ada.'))return;seed().forEach(x=>{const i=S.products.findIndex(p=>p.sku===x.sku);i<0?S.products.push(x):Object.assign(S.products[i],{b2b:x.b2b,b2c:x.b2c,name:x.name,cat:x.cat})});save();toast('Katalog dimuat ulang');man()}
</script>
